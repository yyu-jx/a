spring:
  config:
    import:
      - optional:classpath:/application-ai-service.yml
      - optional:classpath:/application-kdb-service.yml
  # MySQL 配置
  datasource:
    url: jdbc:mysql://localhost:3306/edu_ai
    username: root
    password: 114514 # 不要提交这一行
    driver-class-name: com.mysql.cj.jdbc.Driver

#redis和连接池 配置
  data:
    redis:
      host: localhost
      port: 16379 # 不要提交这一行
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

server:
  servlet:
    encoding: # 避免流式输出的乱码
      charset: UTF-8
      enabled: true
      force: true
  port: 8080

mybatis:
  configuration:
    map-underscore-to-camel-case: true
  mapper-locations: classpath:mapper/*.xml

# 自定义配置
app:
  # 存储路径
  # 请将这里的值换成你电脑上的某个目录，或者项目文件夹的目录（不要加进git）
  # 正式部署时，使用docker挂载。
  storage:
    # 课件生成模块导出的文件
    exports: 'D:\Desktop\file\exports'
    # 用户上传的文件
    uploads: 'D:\Desktop\file\uploads'


