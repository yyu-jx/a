<div class="slide-container" data-element-type="slide" data-element-name="cover-page-left"
     data-element-desc="主容器，采用左对齐布局，通过标题与副标题的层次关系构建封面"
     style="width: 1280px; height: 720px; display: flex; flex-direction: column; align-items: flex-start; justify-content: center; background: #ffffff; position: relative; overflow: hidden; padding-left: 110px; padding-right: 110px; box-sizing: border-box; gap: 2px;">
    <!-- 顶部小标题 -->
    <div data-element-type="subtitle" data-element-name="顶部小标题"
         data-element-desc="封面顶部的引导性小标题，用于引出主题"
         style="font-family: 'Arial', sans-serif; font-size: 17px; font-weight: 400; letter-spacing: 9px; color: #9e9e9e; line-height: 1.4; margin-bottom: 2px;">
        年度战略汇报
    </div>

    <!-- 主标题 -->
    <div data-element-type="title" data-element-name="主标题"
         data-element-desc="封面的核心大标题，传达整个演示文稿的核心主题"
         style="font-family: 'Arial', sans-serif; font-size: 60px; font-weight: 700; color: #212121; line-height: 1.1; max-width: 900px; margin-bottom: 2px;">
        重塑增长
    </div>

    <!-- 副标题 -->
    <div data-element-type="subtitle" data-element-name="副标题"
         data-element-desc="位于主标题下方的副标题，对主题进行补充说明"
         style="font-family: 'Arial', sans-serif; font-size: 25px; font-weight: 300; color: #616161; line-height: 1.4; max-width: 650px; margin-bottom: 2px;">
        2025年度业务发展策略与执行路径全览
    </div>

    <!-- 底部信息区域 -->
    <div data-element-type="container" data-element-name="底部信息容器"
         data-element-desc="包含演讲者与日期信息的底部区域"
         style="display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; margin-top: 50px; gap: 2px;">
        <div data-element-type="text" data-element-name="演讲者姓名"
             data-element-desc="封面显示的演讲者或汇报人姓名"
             style="font-family: 'Arial', sans-serif; font-size: 16px; font-weight: 400; color: #424242; line-height: 1.4;">
            张明远
        </div>
        <div data-element-type="text" data-element-name="演讲者职位" data-element-desc="演讲者的职位或所属部门信息"
             style="font-family: 'Arial', sans-serif; font-size: 14px; font-weight: 300; color: #9e9e9e; line-height: 1.4;">
            战略发展部 ｜ 高级总监
        </div>
        <div data-element-type="text" data-element-name="日期信息" data-element-desc="汇报或演示的日期"
             style="font-family: 'Arial', sans-serif; font-size: 14px; font-weight: 300; color: #9e9e9e; line-height: 1.4; margin-top: 6px;">
            2025年1月15日
        </div>
    </div>
</div>
